<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catastro Murter Betina</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand-block">
          <p class="eyebrow">Sistema catastral</p>
          <h1>CATASTRO MURTER BETINA</h1>
          <p class="subtitle">Consulta de propiedades y parcelas catastrales</p>
        </div>
      </div>

      <nav class="navbar" aria-label="Navegación principal">
        <a class="nav-link active" href="index.html">CATASTRO</a>
        <a class="nav-link" href="gestionar-links.html">ADMINISTRAR LINKS</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">
    <section class="toolbar" aria-label="Búsqueda de parcelas">
      <div class="tool-group search-wide">
        <label for="searchInput">Buscar parcela</label>
        <input id="searchInput" type="search" placeholder="Ej.: 22357/4, 553, HUERTO" autocomplete="off">
      </div>
      <div class="tool-group">
        <label for="filtroZkul">Registro</label>
        <select id="filtroZkul">
          <option value="todos">Todos los ZK. UL.</option>
        </select>
      </div>
      <div class="tool-group">
        <label for="filtroEstado">Estado</label>
        <select id="filtroEstado">
          <option value="todos">Todos</option>
          <option value="completa">Completas</option>
          <option value="parcial">Parciales</option>
          <option value="pendiente">Pendientes</option>
        </select>
      </div>
    </section>

    <section class="summary-panel" aria-label="Resumen general">
      <div class="summary-card">
        <span class="summary-label">Registros de propiedad</span>
        <span id="summaryRegisters" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Parcelas</span>
        <span id="summaryParcels" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Links oficiales</span>
        <span id="summaryLinks" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">KMZ disponibles</span>
        <span id="summaryKmz" class="summary-value">0</span>
      </div>
    </section>

    <section id="propertyGrid" class="property-grid" aria-label="Mosaico de propiedades"></section>

    <section id="detailPanel" class="detail-panel" aria-live="polite"></section>
  </main>

  <div id="parcelModal" class="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Detalle de parcela</h2>
        <button type="button" class="modal-close" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body">
        <div class="info-grid">
          <div class="info-row">
            <div class="info-label">Registro:</div>
            <div id="modalZkul" class="info-value"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Parcela:</div>
            <div id="modalParcela" class="info-value"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Designación:</div>
            <div id="modalDesignacion" class="info-value"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Superficie:</div>
            <div id="modalSuperficie" class="info-value"></div>
          </div>
          <div class="info-row">
            <div class="info-label">Catastro:</div>
            <div id="modalCatastro" class="info-value"></div>
          </div>
          <div class="info-row">
            <div class="info-label">KMZ:</div>
            <div id="modalKmz" class="info-value"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="data/parcelas.js"></script>
  <script src="data/links.config.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
